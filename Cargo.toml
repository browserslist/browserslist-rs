[package]
name = "browserslist-rs"
version = "0.22.0"
authors = ["Pig Fang <g-plane@hotmail.com>"]
edition = "2024"
description = "Rust-ported Browserslist."
repository = "https://github.com/browserslist/browserslist-rs"
license = "MIT"
keywords = ["web", "javascript"]
categories = ["web-programming", "config"]
include = ["**/*.rs", "Cargo.toml"]

[lib]
name = "browserslist"
crate-type = ["rlib"]

[features]
default = ["deflate", "local"]
deflate = ["browserslist-data/deflate"]
# Use the local time zone for "today" (baseline and maintained node queries).
# Without it, UTC is used and `time` crate's local-offset is dropped.
local = ["time/local-offset"]
wasm_bindgen = ["time/wasm-bindgen", "js-sys"]

[dependencies]
browserslist-data = { version = "0.4", path = "data" }
either = "1.17"
itertools = "0.15"
nom = "8.0"
rustc-hash = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
time = { workspace = true }

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
test-case = "3.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }

[workspace]
members = [".", "data", "generate-data", "wasm"]
resolver = "3"

[workspace.dependencies]
rustc-hash = "2.1"
time = "0.3"
