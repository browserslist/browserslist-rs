[package]
name = "browserslist-rs"
version = "0.20.0"
authors = ["Pig Fang <g-plane@hotmail.com>"]
edition = "2024"
description = "Rust-ported Browserslist."
repository = "https://github.com/browserslist/browserslist-rs"
license = "MIT"
keywords = ["web", "javascript"]
categories = ["web-programming", "config"]
include = ["**/*.rs", "Cargo.toml"]

[lib]
name = "browserslist"
crate-type = ["rlib"]

[features]
default = ["deflate"]
deflate = ["browserslist-data/deflate"]
wasm_bindgen = ["chrono/wasmbind", "js-sys"]

[dependencies]
ahash = { workspace = true, features = ["serde"] }
browserslist-data = { version = "0.2.0", path = "data" }
chrono = { workspace = true, features = [
    "std",
    "clock",
    "oldtime",
] } # disable wasmbind by default
either = "1.17"
itertools = "0.15"
nom = "8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
test-case = "3.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }

[workspace]
members = [".", "data", "generate-data", "wasm"]
resolver = "3"

[workspace.dependencies]
ahash = "0.8.12"
chrono = { version = "0.4.38", default-features = false }
